services:
  automl:
    build: .
    volumes:
      # Monter les résultats en local
      - ./python_boston:/app/python_boston
      - ./data:/app/data
    command: python scripts/run_export.py

  notebook:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./python_boston:/app/python_boston
      - ./data:/app/data
      - ./AutoML_Tpot:/app/AutoML_Tpot
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
